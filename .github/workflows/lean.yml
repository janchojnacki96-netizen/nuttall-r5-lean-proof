name: Lean 4 — partial formalization
on:
  push:
    branches: [main, work/lean-ci-bootstrap, integration/r5-one-canonical-certificate]
  pull_request:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Optional W5.Module to check (blank means full build)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
# Obsolete focused PR diagnostics should not consume minutes after a newer
# commit supersedes them. Preserve long canonical push builds (and PR #133)
# to retain the complete .olean cache and avoid redundant integrations.
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.pull_request.number != 133 }}

permissions:
  contents: read

jobs:
  cpp-certificate:
    # PR #133 already builds the same canonical SHA on push. Skip duplicate job.
    # The canonical push is the shared cache source for PRs based on it.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.number != 133 }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect certificate changes (full audit on push)
        id: cpp-changes
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]] || [[ -z "$PR_BASE_SHA" || -z "$PR_HEAD_SHA" ]]; then
            echo 'run_audit=true' >> "$GITHUB_OUTPUT"
          elif BASE_SHA="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")" && git diff --quiet "$BASE_SHA" "$PR_HEAD_SHA" -- certificate/ .github/workflows/lean.yml; then
            echo 'run_audit=false' >> "$GITHUB_OUTPUT"
            echo 'C++ audit skipped: no certificate or audit-workflow changes. Canonical push checks full certificate.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'run_audit=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Build and run GCC checker
        if: ${{ steps.cpp-changes.outputs.run_audit == 'true' }}
        shell: bash
        run: |
          g++ -O2 -std=c++17 -fno-fast-math -ffp-contract=off certificate/certyfikat_theta_W5.cpp -o /tmp/w5_gcc
          /tmp/w5_gcc | tee /tmp/w5_gcc.log
          grep -Fx "Certified all five signs; intervals = 51, max depth = 10" /tmp/w5_gcc.log
      - name: Independent 768-bit integer interval audit
        if: ${{ steps.cpp-changes.outputs.run_audit == 'true' }}
        shell: bash
        run: |
          set -o pipefail
          python3 certificate/audyt_theta_W5_integer.py | tee /tmp/w5_integer.log
          grep -Fx "PASS: exact integer fixed-point interval proof verified 255 signs" /tmp/w5_integer.log
      - name: Exact polynomial majorant audit
        if: ${{ steps.cpp-changes.outputs.run_audit == 'true' }}
        shell: bash
        run: python3 certificate/verify_polynomial_majorant_w5.py
      - name: Build and run Clang checker
        if: ${{ steps.cpp-changes.outputs.run_audit == 'true' }}
        shell: bash
        run: |
          clang++ -O2 -std=c++17 -fno-fast-math -ffp-contract=off certificate/certyfikat_theta_W5.cpp -o /tmp/w5_clang
          /tmp/w5_clang | tee /tmp/w5_clang.log
          grep -Fx "Certified all five signs; intervals = 51, max depth = 10" /tmp/w5_clang.log

  lake-build:
    # PR #133 already builds the same canonical SHA on push. Skip duplicate job.
    # The canonical push is the shared cache source for PRs based on it.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.number != 133 }}
    runs-on: ubuntu-latest
    # Keep the last-cell pilot bounded while retaining existing general CI limits.
    timeout-minutes: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 202 && 15 || 45 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Lean toolchain with elan
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # The pinned manifest and source checkout are one immutable unit.
      # Cache by Lean toolchain + lakefile.toml, both of which determine the pins.
      # v2 intentionally avoids older source-only caches with no manifest.
      - name: Restore pinned Lake package sources and manifest
        id: packages-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .lake/packages
            lake-manifest.json
          key: w5-lake-sources-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}
      - name: Resolve pinned Mathlib dependency only when required
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s lake-manifest.json && -d .lake/packages/mathlib ]]; then
            echo "Pinned Lake source tree + manifest restored; skip lake update"
          else
            ~/.elan/bin/lake update
          fi
          test -s lake-manifest.json
          test -d .lake/packages/mathlib
      - name: Save pinned Lake sources and manifest on canonical push or last-cell pilot
        if: ${{ success() && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.number == 202)) && steps.packages-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            .lake/packages
            lake-manifest.json
          key: w5-lake-sources-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}
      # Cache both .olean and Lake's hashed build traces: isolated .olean are not enough.
      - name: Restore W5 incremental build cache
        id: w5-cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: w5-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            w5-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-
      # Keep the pinned-source and incremental-W5 caches. The attempted
      # full transitive dependency build cache exceeded available runner
      # disk space while creating its tar archive; use Lake's native
      # compressed Mathlib download instead of a second huge archive.
      - name: Download compiled Mathlib cache
        run: ~/.elan/bin/lake exe cache get
      - name: Select Lean build targets
        id: targets
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          REQUESTED_TARGET: ${{ inputs.build_target }}
        run: |
          set -euo pipefail
          targets=W5
          mode=full
          if [[ -n "$REQUESTED_TARGET" ]]; then
            if [[ "$REQUESTED_TARGET" != W5 && ! "$REQUESTED_TARGET" =~ ^W5\.[a-zA-Z0-9_]+$ ]]; then
              echo 'Invalid target (expected W5 or W5.Module)' >&2; exit 1
            fi
            if [[ "$REQUESTED_TARGET" != W5 ]]; then
              module_path="${REQUESTED_TARGET//./\/}.lean"
              test -f "$module_path" || { echo 'Missing module source' >&2; exit 1; }
            fi
            targets="$REQUESTED_TARGET"
            mode=manual-target
          elif [[ "$GITHUB_EVENT_NAME" == pull_request && "$PR_NUMBER" != 133 && -n "$PR_BASE" && -n "$PR_HEAD" ]]; then
            # Build every changed leaf module plus its graph of dependencies.
            # Full W5 remains the canonical PR #133 build and manual dispatch.
            # Compare against the fork point, NOT the moving base SHA:
            # otherwise canonical integration commits look like PR edits.
            if MERGE_BASE="$(git merge-base "$PR_BASE" "$PR_HEAD")"; then
              mapfile -t changed < <(git diff --name-only --diff-filter=ACMR "$MERGE_BASE" "$PR_HEAD" -- 'W5/*.lean' || true)
            else
              changed=()
            fi
            # Even 13+ changed modules must be checked: a full W5 build
            # omits unimported diagnostic targets and can be falsely green.
            if (( ${#changed[@]} > 0 )); then
              targets=''
              for file in "${changed[@]}"; do
                module="${file%.lean}"
                targets+="${module//\//.} "
              done
              targets="${targets% }"
              mode=focused-pr
            fi
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Checking $targets ($mode); focused success is NOT full R5 verification"
      - name: Compile selected Lean modules and their dependencies
        shell: bash
        env:
          LAKE_TARGETS: ${{ steps.targets.outputs.targets }}
          BUILD_MODE: ${{ steps.targets.outputs.mode }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          if [[ "$PR_NUMBER" == 202 && "$BUILD_MODE" == focused-pr ]]; then
            # Reuse all certified matrix rows. Only the Gamma primitives
            # and the remaining compositional proofs are new work.
            : > /tmp/w5-build.log
            start=$SECONDS
            run_group() {
              local label="$1" limit="$2" rc stage_start
              shift 2
              stage_start=$SECONDS
              echo "::group::$label (wall-clock limit ${limit}s)"
              set +e
              timeout --kill-after=5s "${limit}s" ~/.elan/bin/lake build "$@" 2>&1 | tee -a /tmp/w5-build.log
              rc="${PIPESTATUS[0]}"
              set -e
              echo "::endgroup::"
              echo "| $label | $((SECONDS-stage_start))s | $rc |" | tee -a "$GITHUB_STEP_SUMMARY"
              if [[ "$rc" == 124 || "$rc" == 137 ]]; then
                echo "::error title=Numerical stage timed out::$label exceeded ${limit}s; inspect completed bin checks."
              elif [[ "$rc" != 0 ]]; then
                echo "::error title=Lean stage failed::$label exited $rc."
              fi
              return "$rc"
            }
            echo "### Last-cell Gamma primitive replay timings (exit 0 = compiled)" >> "$GITHUB_STEP_SUMMARY"
            echo "| Stage | Wall time | Exit code |" >> "$GITHUB_STEP_SUMMARY"
            echo "| --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
            read -ra changed_targets <<< "$LAKE_TARGETS"
            for target in "${changed_targets[@]}"; do
              case "$target" in
                W5.ThetaLastCellCompactDyadicBase|W5.ThetaLastCellCompactDyadicPivot|W5.ThetaLastCellCompactDyadicGaussian|W5.ThetaLastCellCompactDyadicGammaA|W5.ThetaLastCellCompactDyadicGammaB|W5.ThetaLastCellCompactDyadicFit|W5.ThetaLastCellCompactDyadicWitness|W5.ThetaLastCellReplayInputs|W5.ThetaLastCellReplayExp|W5.ThetaLastCellReplayGamma0|W5.ThetaLastCellReplayGamma1|W5.ThetaLastCellReplayGamma2|W5.ThetaLastCellReplayRow0|W5.ThetaLastCellReplayRow1|W5.ThetaLastCellReplayRow2|W5.ThetaLastCellReplayRow3|W5.ThetaLastCellReplayRow4|W5.ThetaLastCellReplaySoundness|W5.ThetaLastCellGammaReplayData|W5.ThetaLastCellGammaWExpChecked|W5.ThetaLastCellGammaBin0|W5.ThetaLastCellGammaBin1|W5.ThetaLastCellGammaBin2|W5.ThetaLastCellGammaBin3|W5.ThetaLastCellGammaBin4|W5.ThetaLastCellGammaBin5|W5.ThetaLastCellGammaBin6|W5.ThetaLastCellGammaBin7|W5.ThetaLastCellGammaBin8|W5.ThetaLastCellGammaBin9|W5.ThetaLastCellGammaBin10|W5.ThetaLastCellGammaBin11|W5.ThetaLastCellGammaMomentSums|W5.ThetaLastCellGammaReplaySoundness) ;;
                *) echo "::error::Unscheduled changed module $target; extend the staged graph before running." ; exit 1 ;;
              esac
            done
            if ! run_group cached-matrix-and-eligibility 90 W5.ThetaLastCellCompactDyadic{Base,Pivot,Gaussian,GammaA,GammaB} W5.ThetaLastCellReplay{Inputs,Exp,Row0,Row1,Row2,Row3,Row4}; then
              echo "$((SECONDS-start))" > /tmp/w5-build-seconds.txt
              exit 1
            fi
            failed=0
            if ! run_group compose-verified-matrix-rows 60 W5.ThetaLastCellCompactDyadicFit; then
              failed=$((failed+1))
            fi
            if ! run_group gamma-primitive-data 90 W5.ThetaLastCellGammaReplayData; then
              echo "$((SECONDS-start))" > /tmp/w5-build-seconds.txt
              exit 1
            fi
            if ! run_group gamma-exponential-table-and-moment-sums 90 W5.ThetaLastCellGamma{WExpChecked,MomentSums}; then
              failed=$((failed+1))
            fi
            # Each of the twelve bins is a separate module, with one left
            # lower and one right upper bound per moment. Lake schedules
            # them independently and retains successful .oleans.
            if ! run_group twelve-gamma-bin-checks 240 W5.ThetaLastCellReplayGamma{0,1,2}; then
              failed=$((failed+1))
            fi
            if (( failed > 0 )); then
              echo "$((SECONDS-start))" > /tmp/w5-build-seconds.txt
              echo "::error::$failed independent replay group(s) did not compile; final proof not attempted."
              exit 1
            fi
            if ! run_group gamma-and-final-proof-composition 120 W5.ThetaLastCellGammaReplaySoundness W5.ThetaLastCellReplaySoundness W5.ThetaLastCellCompactDyadicWitness; then
              echo "$((SECONDS-start))" > /tmp/w5-build-seconds.txt
              exit 1
            fi
            echo "$((SECONDS-start))" > /tmp/w5-build-seconds.txt
          else
            read -ra targets <<< "$LAKE_TARGETS"
            /usr/bin/time -f '%e' -o /tmp/w5-build-seconds.txt \
              ~/.elan/bin/lake build "${targets[@]}" 2>&1 | tee /tmp/w5-build.log
            exit "${PIPESTATUS[0]}"
          fi
      # GitHub caches are immutable: each run gets its own key. Restore by
      # compatibility prefix; a failing Lean target still saves completed modules.
      - name: Save partial or complete W5 build cache
        if: ${{ always() && steps.w5-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: w5-lake-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Report incremental build performance
        if: always()
        shell: bash
        env:
          BUILD_MODE: ${{ steps.targets.outputs.mode }}
          BUILD_TARGETS: ${{ steps.targets.outputs.targets }}
          RESTORED_CACHE_KEY: ${{ steps.w5-cache.outputs.cache-matched-key }}
        run: |
          echo "### W5 incremental compilation" >> "$GITHUB_STEP_SUMMARY"
          echo "Mode: $BUILD_MODE; targets: $BUILD_TARGETS" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Restored cache key: $RESTORED_CACHE_KEY" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/w5-build-seconds.txt ]; then
            echo "Lake build seconds: $(cat /tmp/w5-build-seconds.txt)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f /tmp/w5-build.log ]; then
            echo "W5 build operations: $(grep -Ec '(Built|Building) W5[.]' /tmp/w5-build.log || true)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check Lean admissions (ignore doc comments, never ignore source tokens)
        run: python3 certificate/check_lean_admissions.py
      - name: Report formal proof status
        shell: bash
        run: |
          echo "This CI currently checks ONLY compilation of partial lemmas."
          echo "It DOES NOT certify the order-five Nuttall conjecture."
          if grep -R -Eq 'theorem[[:space:]]+nuttall_r5[[:space:]]*:' --include='*.lean' W5; then
            echo "A theorem named nuttall_r5 exists; its hypotheses/axioms still require auditing."
          else
            echo "Unconditional theorem W5.nuttall_r5 : MainClaim is NOT present."
          fi
